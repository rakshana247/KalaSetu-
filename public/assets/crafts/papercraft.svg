<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="100%" stop-color="#ECE7DC"/>
    </linearGradient>
    <linearGradient id="journalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C6E5A"/>
      <stop offset="50%" stop-color="#245441"/>
      <stop offset="100%" stop-color="#123B2C"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#213E33" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#paperBg)"/>
  <ellipse cx="400" cy="515" rx="240" ry="22" fill="#D5CFC2" opacity="0.6"/>
  <!-- Handmade Deckle-edge Floral Botanical Paper Journal & Papier-mâché Box -->
  <g filter="url(#paperShadow)">
    <!-- Handmade Journal Cover -->
    <rect x="220" y="160" width="360" height="320" rx="14" fill="url(#journalGrad)"/>
    <!-- Embossed Botanical Fern & Gold Foil Leaves -->
    <g fill="#F2D388" opacity="0.85">
      <path d="M400,200 Q360,260 400,320 Q440,260 400,200 Z"/>
      <circle cx="360" cy="240" r="10"/>
      <circle cx="440" cy="240" r="10"/>
      <circle cx="340" cy="280" r="8"/>
      <circle cx="460" cy="280" r="8"/>
      <!-- Gold Cord Wrap & Wooden Bead -->
      <line x1="220" y1="320" x2="580" y2="320" stroke="#F2D388" stroke-width="4"/>
      <circle cx="500" cy="320" r="12" fill="#BA6433"/>
    </g>
    <!-- Handmade Cotton Rag Paper Deckled Edges Peeking Out -->
    <path d="M570,180 L595,185 L590,200 L600,220 L588,245 L598,270 L586,300 L600,335 L588,370 L598,400 L585,430 L595,455 L570,460 Z" fill="#F8F4EA" stroke="#DFD7C4" stroke-width="2"/>
    <!-- Pressed Real Dried Flower Petals on Paper -->
    <circle cx="585" cy="230" r="4" fill="#C45D3A" opacity="0.8"/>
    <circle cx="590" cy="360" r="4" fill="#6B8E23" opacity="0.8"/>
    <circle cx="582" cy="410" r="3.5" fill="#C45D3A" opacity="0.8"/>
  </g>
  <!-- Category Badge -->
  <rect x="40" y="40" rx="20" ry="20" width="220" height="42" fill="#123F32" opacity="0.9"/>
  <text x="56" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F8F5EF">PAPERCRAFT &amp; PAPIER-MÂCHÉ</text>
  <text x="40" y="555" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#245441">Handmade Deckled Paper &amp; Botanical Craft</text>
</svg>
