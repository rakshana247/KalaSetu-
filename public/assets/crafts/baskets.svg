<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="basketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#EEE6D8"/>
    </linearGradient>
    <linearGradient id="caneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE82"/>
      <stop offset="50%" stop-color="#C29452"/>
      <stop offset="100%" stop-color="#8E6325"/>
    </linearGradient>
    <filter id="caneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4E3612" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#basketBg)"/>
  <ellipse cx="400" cy="520" rx="240" ry="22" fill="#D3C3B1" opacity="0.6"/>
  <!-- Handwoven Cane & Bamboo Basket -->
  <g filter="url(#caneShadow)">
    <!-- Basket Body Shape -->
    <path d="M250,260 L290,470 C290,490 350,500 400,500 C450,500 510,490 510,470 L550,260 Z" fill="url(#caneGrad)"/>
    <!-- Top Rim Oval -->
    <ellipse cx="400" cy="260" rx="150" ry="25" fill="#754E18"/>
    <ellipse cx="400" cy="257" rx="145" ry="21" fill="#E5BE82"/>
    <!-- Woven Cane Handle -->
    <path d="M260,260 C260,110 540,110 540,260" fill="none" stroke="#C29452" stroke-width="18" stroke-linecap="round"/>
    <path d="M260,260 C260,110 540,110 540,260" fill="none" stroke="#68420E" stroke-width="3" stroke-dasharray="12,10"/>
    <!-- Woven Twill Lattice Pattern Lines -->
    <g stroke="#68420E" stroke-width="2.5" opacity="0.6">
      <path d="M280,310 Q400,340 520,310"/>
      <path d="M285,360 Q400,390 515,360"/>
      <path d="M290,410 Q400,440 510,410"/>
      <path d="M295,460 Q400,485 505,460"/>
      <!-- Vertical Warp Ribs -->
      <line x1="330" y1="275" x2="340" y2="490"/>
      <line x1="370" y1="280" x2="375" y2="498"/>
      <line x1="400" y1="282" x2="400" y2="500"/>
      <line x1="430" y1="280" x2="425" y2="498"/>
      <line x1="470" y1="275" x2="460" y2="490"/>
    </g>
  </g>
  <!-- Category Badge -->
  <rect x="40" y="40" rx="20" ry="20" width="220" height="42" fill="#123F32" opacity="0.9"/>
  <text x="56" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F8F5EF">BASKETS &amp; NATURAL FIBER</text>
  <text x="40" y="555" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#6A4612">Handwoven Bamboo &amp; Cane Basketry</text>
</svg>
