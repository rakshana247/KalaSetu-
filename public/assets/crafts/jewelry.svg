<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="jewelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="goldKundan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997718"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D12E4A"/>
      <stop offset="100%" stop-color="#800D20"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#145A32"/>
    </linearGradient>
    <filter id="jewelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3B18" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#jewelBg)"/>
  <!-- Velvet Presentation Display Cushion -->
  <rect x="140" y="110" width="520" height="400" rx="32" fill="#1C3026" filter="url(#jewelGlow)"/>
  <rect x="155" y="125" width="490" height="370" rx="24" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/>
  <!-- Kundan / Meenakari Statement Choker Necklace -->
  <g filter="url(#jewelGlow)">
    <!-- Choker Arc -->
    <path d="M220,230 C220,380 580,380 580,230" fill="none" stroke="url(#goldKundan)" stroke-width="20" stroke-linecap="round"/>
    <path d="M230,230 C230,370 570,370 570,230" fill="none" stroke="#F5D77F" stroke-width="4" stroke-dasharray="10,8"/>
    <!-- Central Kundan Medallion -->
    <circle cx="400" cy="345" r="38" fill="url(#goldKundan)"/>
    <circle cx="400" cy="345" r="24" fill="url(#rubyGrad)"/>
    <!-- Surrounding Pearls -->
    <circle cx="400" cy="395" r="8" fill="#FBF8F3"/>
    <circle cx="375" cy="390" r="7" fill="#FBF8F3"/>
    <circle cx="425" cy="390" r="7" fill="#FBF8F3"/>
    <!-- Left Flanking Medallions -->
    <circle cx="330" cy="325" r="26" fill="url(#goldKundan)"/>
    <circle cx="330" cy="325" r="15" fill="url(#emeraldGrad)"/>
    <circle cx="330" cy="360" r="6" fill="#FBF8F3"/>
    <!-- Right Flanking Medallions -->
    <circle cx="470" cy="325" r="26" fill="url(#goldKundan)"/>
    <circle cx="470" cy="325" r="15" fill="url(#emeraldGrad)"/>
    <circle cx="470" cy="360" r="6" fill="#FBF8F3"/>
    <!-- Pair of Matching Jhumka Earrings -->
    <!-- Left Jhumka -->
    <circle cx="250" cy="280" r="14" fill="url(#goldKundan)"/>
    <circle cx="250" cy="280" r="8" fill="url(#rubyGrad)"/>
    <path d="M230,310 C230,295 270,295 270,310 Z" fill="url(#goldKundan)"/>
    <circle cx="240" cy="320" r="4" fill="#FBF8F3"/>
    <circle cx="250" cy="322" r="4" fill="#FBF8F3"/>
    <circle cx="260" cy="320" r="4" fill="#FBF8F3"/>
    <!-- Right Jhumka -->
    <circle cx="550" cy="280" r="14" fill="url(#goldKundan)"/>
    <circle cx="550" cy="280" r="8" fill="url(#rubyGrad)"/>
    <path d="M530,310 C530,295 570,295 570,310 Z" fill="url(#goldKundan)"/>
    <circle cx="540" cy="320" r="4" fill="#FBF8F3"/>
    <circle cx="550" cy="322" r="4" fill="#FBF8F3"/>
    <circle cx="560" cy="320" r="4" fill="#FBF8F3"/>
  </g>
  <!-- Category Badge -->
  <rect x="40" y="40" rx="20" ry="20" width="220" height="42" fill="#123F32" opacity="0.9"/>
  <text x="56" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F8F5EF">TRADITIONAL JEWELLERY</text>
  <text x="40" y="555" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#886411">Handcrafted Kundan, Meenakari &amp; Silver</text>
</svg>
