<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#ECE5DA"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="35%" stop-color="#C69E38"/>
      <stop offset="70%" stop-color="#936F1C"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E25822"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
    <filter id="brassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4E3609" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#metalBg)"/>
  <ellipse cx="400" cy="530" rx="220" ry="20" fill="#D3C3B1" opacity="0.6"/>
  <!-- Traditional Indian Brass Samai / Diya Figurine -->
  <g filter="url(#brassGlow)">
    <!-- Base Pedestal -->
    <path d="M290,520 C290,490 350,470 400,470 C450,470 510,490 510,520 Z" fill="url(#brassGrad)"/>
    <!-- Stem Column with Turned Rings -->
    <rect x="382" y="270" width="36" height="205" rx="6" fill="url(#brassGrad)"/>
    <ellipse cx="400" cy="420" rx="42" ry="10" fill="#E5C158"/>
    <ellipse cx="400" cy="340" rx="36" ry="9" fill="#E5C158"/>
    <!-- Oil Reservoir / Bowl with Spouts -->
    <path d="M270,270 C270,310 340,330 400,330 C460,330 530,310 530,270 C530,250 460,240 400,240 C340,240 270,250 270,270 Z" fill="url(#brassGrad)"/>
    <ellipse cx="400" cy="260" rx="125" ry="18" fill="#5E430B"/>
    <!-- Dhokra Tribal Bird / Peacock Finial -->
    <path d="M380,240 C380,190 360,170 380,140 C390,125 410,125 420,140 C440,170 420,190 420,240 Z" fill="url(#brassGrad)"/>
    <!-- Golden Flame -->
    <path d="M400,135 C385,115 390,90 400,70 C410,90 415,115 400,135 Z" fill="url(#flameGrad)"/>
    <!-- Etched Traditional Dhokra Filigree Spirals -->
    <circle cx="340" cy="285" r="8" fill="none" stroke="#FCEBB6" stroke-width="2"/>
    <circle cx="400" cy="295" r="9" fill="none" stroke="#FCEBB6" stroke-width="2"/>
    <circle cx="460" cy="285" r="8" fill="none" stroke="#FCEBB6" stroke-width="2"/>
  </g>
  <!-- Category Badge -->
  <rect x="40" y="40" rx="20" ry="20" width="220" height="42" fill="#123F32" opacity="0.9"/>
  <text x="56" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F8F5EF">BRASS &amp; METALWORK</text>
  <text x="40" y="555" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#7A560E">Hand-cast Dhokra &amp; Brass Metalware</text>
</svg>
